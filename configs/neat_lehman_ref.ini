# Reference NEAT settings of the Lehman-Stanley maze experiment (REF_CFG in lehman_maze/lehman_maze_ns.py, taken from the
# maze solver of "Hands-on Neuroevolution with Python", chapter 6), adapted to this project's robot only where the robot
# differs: 15 inputs (12 rays + goal distance/heading), tanh outputs (wheel commands in [-1, 1]) and a population of 150
# (same 180k-episode budget as the other methods). Every other value is the reference value. Used by the LNS_ref setting
# (src/experiments/run_ablation.py). Keep this file ASCII: neat-python 2.0.0 reads it with the locale encoding.
[NEAT]
fitness_criterion     = max
fitness_threshold     = 1000000
pop_size              = 150
reset_on_extinction   = True
no_fitness_termination = True

[DefaultGenome]
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1
compatibility_disjoint_coefficient = 1.1
compatibility_weight_coefficient   = 0.5
conn_add_prob           = 0.5
conn_delete_prob        = 0.1
enabled_default         = True
enabled_mutate_rate     = 0.01
feed_forward            = False
initial_connection      = partial_direct 0.5
node_add_prob           = 0.1
node_delete_prob        = 0.1
num_hidden              = 1
num_inputs              = 15
num_outputs             = 2
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 100
species_elitism      = 1

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.1
min_species_size   = 2
