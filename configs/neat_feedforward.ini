# =============================================================================
# NEAT-Python Configuration — Feedforward (No Recurrent Connections)
# Project: NEAT-Based Autonomous Robot Navigation
# Reference: brainstorm/02_neat/config_tuning.md (Decision #10, #11)
# =============================================================================

[NEAT]
fitness_criterion     = max
fitness_threshold     = 16.0
pop_size              = 150
reset_on_extinction   = True

[DefaultGenome]
# --- Network Topology ---
num_inputs              = 15
num_hidden              = 0
num_outputs             = 2
initial_connection      = full_direct
feed_forward            = True

# --- Activation Function (Decision #11: tanh fixed) ---
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

# --- Aggregation ---
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# --- Topology Mutations (Gradual Complexification) ---
conn_add_prob           = 0.05
conn_delete_prob        = 0.01
node_add_prob           = 0.03
node_delete_prob        = 0.01

# --- Connection Weight Mutations ---
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

# --- Bias Mutations ---
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# --- Connection Enable/Disable ---
enabled_default         = True
enabled_mutate_rate     = 0.01

# --- Compatibility (Speciation Distance) ---
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 15
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 2
