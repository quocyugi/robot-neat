# =============================================================================
# NEAT-Python Configuration - Recurrent (Allows Recurrent Connections)
# Project: NEAT-Based Autonomous Robot Navigation
# Reference: brainstorm/02_neat/recurrent_vs_ff.md (Decision #12, #13)
# Note: Identical to feedforward EXCEPT feed_forward = False
# =============================================================================

# -----------------------------------------------------------------------------
# BAN DA SUA cho neat-python==2.0.0 (bao cao muc 8.13).
# Moi dong doi so voi ban goc co chu thich "SUA" ngay phia tren; diff o thu muc diff/.
# -----------------------------------------------------------------------------

[NEAT]
fitness_criterion       = max
fitness_threshold       = 16.0
pop_size                = 150
reset_on_extinction     = True
# SUA: False -> True. Voi False, run() dung ngay khi co genome dat fitness_threshold = 16,
# ma phong trong o cap 1 cho 16 diem ngay the he 0-1, nen M1, M2 khong tien hoa (loi L01).
no_fitness_termination  = True

[DefaultGenome]
# --- Network Topology ---
num_inputs              = 15
# Giu 0. Neu tang, goi unify_initial_hidden_keys() (src/neat_engine/neat_fixes.py) ngay sau
# neat.Population(); neu khong, moi genome ban dau thanh mot loai va quan the sup o the he dau.
num_hidden              = 0
num_outputs             = 2
initial_connection      = full_direct
feed_forward            = False

# --- Activation Function (Decision #11: tanh fixed) ---
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

# --- Aggregation ---
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# --- Topology Mutations (Gradual Complexification) ---
# SUA (4 dong): 0.05 / 0.01 / 0.03 / 0.01 -> 0.5 / 0.1 / 0.1 / 0.1, nhu cau hinh me cung tham chieu
# (Hands-on Neuroevolution with Python, chuong 6). Gia tri cu lay tu bai NEAT goc; tren neat-python
# chung lam XOR chi giai 87/100 lan, so voi 100/100 cua cau hinh mau.
conn_add_prob           = 0.5
conn_delete_prob        = 0.1
node_add_prob           = 0.1
node_delete_prob        = 0.1
# SUA (dong moi): neat-python 2.0.0 doc khoa nay khi vang mat thanh chuoi 'false', va chuoi khac rong
# duoc coi la True, nen ban goc thuc ra da chay che do mot dot bien cau truc cho moi con. Ghi ro de
# hanh vi khong am tham doi khi nang phien ban; moi kiem thu trong bao cao deu chay o che do nay.
single_structural_mutation = True

# --- Connection Weight Mutations ---
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
# SUA (4 dong: power va replace cua trong so va bias): 0.5 / 0.1 -> 0.1 / 0.01. Cong nhieu sigma 0,5 vao
# 80% trong so va gan lai 10% moi the he qua tho de tinh chinh bo dieu khien (loi L32). Cung 180.000 luot,
# gia tri moi nang SR cap 3 ro ret (bao cao muc 8.13). Neu doi bai toan, quet lai trong khoang 0,05-0,3.
weight_mutate_power     = 0.1
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.01

# --- Bias Mutations ---
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.1
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.01

# --- Node Response Multiplier (neat-python >= 2.0.0) ---
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# --- Connection Enable/Disable ---
enabled_default         = True
enabled_mutate_rate     = 0.01

# --- Compatibility (Speciation Distance) ---
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
# Giu 3.0. Voi 15 dau vao chi co 1-3 loai, nhung neat-python khong gop loai nen tang nguong khong
# giam duoc so loai; xem muc 8.13 truoc khi bat TargetSpeciesReporter.
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
# SUA: 15 -> 20 nhu vi du cua neat-python. Fitness moi the he do tren ban do moi nen on,
# 15 the he de loai nham mot loai dang tot.
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.5
min_species_size   = 2
